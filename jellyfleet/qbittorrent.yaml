services:
# Instance 1
  qbittorrent-ganymede:
    image: ghcr.io/hotio/qbittorrent:release-v5
    restart: unless-stopped
    container_name: qbittorrent-ganymede
    hostname: qbittorrent-ganymede.internal

    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      traefik.http.routers.qbittorrent-ganymede.rule: Host(`ganymede.qbittorrent.xn--krver-jua.it`)
      traefik.http.routers.qbittorrent-ganymede.entrypoints: websecure
      traefik.http.routers.qbittorrent-ganymede.tls: true
      traefik.http.routers.qbittorrent-ganymede.middlewares: error-pages-middleware
      traefik.http.routers.qbittorrent-ganymede.service: qbittorrent-ganymede
      traefik.http.services.qbittorrent-ganymede.loadBalancer.server.port: 8080

    environment:
      PUID: 1109
      PGID: 1001
      UMASK: 002
      TZ: Europe/Amsterdam

      # VPN config
      VPN_ENABLED: "true"
      VPN_CONF: wg0-ganymede
      VPN_PROVIDER: proton 
      VPN_LAN_NETWORK: 10.0.8.1/24
      VPN_LAN_LEAK_ENABLED: "false"
      VPN_AUTO_PORT_FORWARD: "true"
      VPN_HEALTHCHECK_ENABLED: "true"

    volumes:
      - type: bind
        source: ${APPDATA_LOCATION:?No appdata directory configured}/qbittorrent/ganymede/config
        target: /config
      - type: bind
        source: ${DATA_LOCATION:?No data directory configured}/torrents
        target: /data/torrents
    
    networks:
      - traefik

    cap_add:
      - NET_ADMIN

    healthcheck:
      test: [
        "CMD",
        "curl",
        "--fail",
        "--silent",
        "--show-error",
        "--output", "/dev/null",
        "http://127.0.0.1:8080/"
      ]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3


