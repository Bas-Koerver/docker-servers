services:
  yamtrack:
    # 0.26.3
    image: ghcr.io/fuzzygrim/yamtrack@sha256:78497b454b2b52d3b1062f6fd238351d714cff0895db4369e49ace36f4622e75
    restart: unless-stopped
    container_name: yamtrack
    hostname: yamtrack.internal

    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      traefik.http.routers.yamtrack.rule: Host(`yamtrack.xn--krver-jua.it`)
      traefik.http.routers.yamtrack.entrypoints: websecure
      traefik.http.routers.yamtrack.tls: true
      traefik.http.routers.yamtrack.middlewares: error-pages-middleware
      traefik.http.routers.yamtrack.service: yamtrack
      traefik.http.services.yamtrack.loadBalancer.server.port: 8000

    environment:
      PGUID: 1113
      PGID: 1003
      TZ: Europe/Amsterdam

      URLS: https://yamtrack.xn--krver-jua.it
      SECRET_FILE: longstring

      # Database
      REDIS_URL: redis://yamtrack-redis:6379
      DB_HOST: postgresql-yamtrack
      DB_PORT: 5432
      DB_NAME: yamtrack
      DB_USER: yamtrack
      DB_PASSWORD_FILE: /run/secrets/pg_pass

      # Media sources
      TMDB_API_FILE: /run/secrets/tmdb_api
      MAL_API_FILE: /run/secrets/mal_api
      IGDB_ID_FILE: /run/secrets/igdb_id
      IGDB_SECRET_FILE: /run/secrets/igdb_secret
      HARDCOVER_API_FILE: /run/secrets/hardcover_api
      COMICVINE_API_FILE: /run/secrets/comicvine_api
      TRAKT_API_FILE: /run/secrets/trakt_api

      # OIDC
      SOCIAL_PROVIDERS: 
      ACCOUNT_LOGOUT_REDIRECT_URL: 
      SOCIALACCOUNT_PROVIDERS_FILE: /run/secrets/socialaccount_providers
      SOCIALACCOUNT_ONLY: "false"

    secrets:
      - source: YAMTRACK_TMDB_API_SECRET
        target: tmdb_api
      - source: YAMTRACK_MAL_API_SECRET
        target: mal_api
      - source: YAMTRACK_IGDB_ID
        target: igdb_id
      - source: YAMTRACK_IGDB_SECRET
        target: igdb_secret
      - source: YAMTRACK_HARDCOVER_API_SECRET
        target: hardcover_api
      - source: YAMTRACK_COMICVINE_API_SECRET
        target: comicvine_api
      - source: YAMTRACK_TRAKT_API_SECRET
        target: trakt_api
      - source: YAMTRACK_SOCIALACCOUNT_PROVIDERS
        target: socialaccount_providers
      - source: YAMTRACK_POSTGRES_PASSWORD
        target: pg_pass

    networks:
      - traefik
      - back-end_yamtrack
      

  postgresql:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    container_name: postgresql-yamtrack

    environment:
      POSTGRES_DB: yamtrack
      POSTGRES_USER: yamtrack
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pass

    volumes:
      - type: bind
        source: ${APPDATA_LOCATION:?No appdata directory configured}/yamtrack/postgresql
        target: /var/lib/postgresql/
    
    secrets:
      - source: YAMTRACK_POSTGRES_PASSWORD
        target: pg_pass

    networks:
      - back-end_yamtrack

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -q --username \"$${POSTGRES_USER}\" --dbname postgres"
        ]
      start_period: 20s
      timeout: 5s
      interval: 30s
      retries: 5


  redis:
    container_name: yamtrack-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

    networks:
      - back-end_yamtrack


networks:
  back-end_yamtrack:
    internal: true


volumes:
  redis_data: